services:
  redis:
    image: redis:7-alpine
    container_name: mern-smtp-redis
    restart: "no"
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mern-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB service (optional - only needed if using local DB)
  mongodb:
    profiles: ["local-db"]
    image: mongo:7.0
    container_name: mern-smtp-mongodb
    restart: "no"
    mem_limit: 512m
    environment:
      MONGO_INITDB_DATABASE: mern_smtp
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - mern-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend service
  backend:
    env_file:
      - ./backend/.env
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mern-smtp-backend
    restart: "no"
    mem_limit: 256m
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI_LOCAL=mongodb://mongodb:27017/mern_smtp
      - MONGODB_URI=mongodb://mongodb:27017/mern_smtp
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:3000
      - REDIS_URL=redis://redis:6379
    volumes:
      - uploads_data:/app/uploads
    networks:
      - mern-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/email/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend service
  worker:
    env_file:
      - ./backend/.env
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mern-smtp-worker
    restart: "no"
    mem_limit: 256m
    command: ["node", "workers/emailWorker.js"]
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI_LOCAL=mongodb://mongodb:27017/mern_smtp
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - mern-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: mern-smtp-frontend
    restart: "no"
    mem_limit: 128m
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mern-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  mern-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
